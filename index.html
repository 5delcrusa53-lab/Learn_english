<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F6FB">
<meta name="description" content="Apprendre l'anglais du niveau A1 au C1 : vocabulaire prononcé, jeux et révision espacée.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest" id="manifestLink">
<link rel="apple-touch-icon" href="apple-touch-icon.png" id="appleIcon">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Crect x='10' y='36' width='44' height='11' rx='2' fill='%23FFE15A'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-weight='700' font-size='34' text-anchor='middle' fill='%23141A30'%3Een%3C/text%3E%3C/svg%3E">
<title>English Lab, apprendre l'anglais</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --paper:#F4F6FB;--surface:#FFFFFF;--sunk:#EEF1F7;--ink:#141A30;--muted:#5B6480;--line:#E0E5EF;
  --lv:#0E8A68;--lv-soft:#DDF4EC;--lv-ink:#FFFFFF;
  --marker:#FFE15A;
  --ok:#0F7A55;--ok-soft:#DDF3E9;--bad:#C0304A;--bad-soft:#FCE4E9;
  --lift:0 1px 0 rgba(20,26,48,.04),0 18px 40px -26px rgba(20,26,48,.45);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif","Droid Serif",Georgia,serif;
  --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Noto Serif","Segoe UI","Lucida Sans Unicode",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --r1:12px;--r2:16px;--r3:24px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1120;--surface:#151C30;--sunk:#10172A;--ink:#E9EDF8;--muted:#98A2C1;--line:#252F49;
    --marker:rgba(242,204,58,.38);
    --ok:#4CC593;--ok-soft:#13332A;--bad:#FF7D93;--bad-soft:#3A1824;
    --lift:0 1px 0 rgba(0,0,0,.2),0 18px 40px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1120;--surface:#151C30;--sunk:#10172A;--ink:#E9EDF8;--muted:#98A2C1;--line:#252F49;
  --marker:rgba(242,204,58,.38);
  --ok:#4CC593;--ok-soft:#13332A;--bad:#FF7D93;--bad-soft:#3A1824;
  --lift:0 1px 0 rgba(0,0,0,.2),0 18px 40px -24px rgba(0,0,0,.8);
}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:50}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--lv);outline-offset:2px}
.serif{font-family:var(--serif)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px 12px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand install" "levels levels";gap:10px 12px;align-items:center}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1}
.logo{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font:700 20px/1 var(--serif);color:var(--ink);flex:none}
.logo span{background:linear-gradient(var(--marker),var(--marker)) no-repeat 0 88%/100% .45em;padding:0 2px}
.install{grid-area:install;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px 0 12px;border-radius:999px;border:0;background:var(--lv);color:var(--lv-ink);font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 6px 16px -8px var(--lv)}
.install svg{width:19px;height:19px;stroke-width:2.2}
.install:active{transform:scale(.97)}
.levels{grid-area:levels;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:6px 3px 7px;display:flex;flex-direction:column;align-items:center;line-height:1.15;cursor:pointer;min-width:0;transition:background .2s,color .2s,border-color .2s}
.lvl b{font-size:16px}
.lvl span{font-size:11px;line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lvl[aria-pressed="true"]{background:var(--lv);color:var(--lv-ink);border-color:var(--lv)}
.lvl[aria-pressed="true"] span{color:inherit;opacity:.85}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;padding:2px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative}
.tabs .ico{display:grid;place-items:center;width:58px;height:32px;border-radius:16px;transition:background .2s}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"] .ico{background:var(--lv-soft);color:var(--lv)}
.badge{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;font-weight:700;text-align:center}
main{display:block;padding:18px 16px 112px;max-width:780px;margin:0 auto;outline:none}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-areas:"top top" "nav main"}
  .topbar{grid-area:top;grid-template-columns:206px 1fr auto;grid-template-areas:"brand levels install";padding:14px 24px}
  .levels{max-width:580px}
  .tabs{grid-area:nav;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:20px 14px}
  .tabs button{flex-direction:row;gap:10px;font-size:15px;padding:4px 10px 4px 4px;border-radius:20px;justify-content:flex-start}
  .tabs .ico{width:44px;height:36px;border-radius:18px}
  .tabs button[aria-current="page"]{background:var(--lv-soft)}
  .badge{position:static;margin-left:auto}
  main{grid-area:main;padding:28px 32px 56px;margin:0;width:100%}
}

/* ---------- Generic ---------- */
.view-title{font-family:var(--serif);font-size:30px;line-height:1.15;margin:2px 0 6px;letter-spacing:-.015em;font-weight:700}
.view-sub{color:var(--muted);margin:0 0 16px;font-size:15px;max-width:62ch}
.sub{font-size:17px;margin:28px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r1);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--lv);border-color:var(--lv);color:var(--lv-ink)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn-quiet[aria-pressed="true"]{color:var(--lv)}
.btn-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.wide{width:100%;margin-top:14px}
.icon-btn{width:48px;height:48px;flex:none;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);padding:0}
.icon-btn svg{width:21px;height:21px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .grow{flex:1 1 150px}
.row-c{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.counter{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0;font-variant-numeric:tabular-nums}
@media (hover:hover){.only-touch{display:none}}
@media (hover:none){.only-mouse{display:none}}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips{flex-wrap:wrap;margin:0;padding:2px 0 12px}}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip small{opacity:.65;margin-left:6px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--lv);color:var(--lv-ink);border-color:var(--lv)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:2px 0 14px}
.tools{display:flex;gap:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--lv-soft);color:var(--ink);font-weight:700}
.empty{padding:22px 0 6px}
.empty p{font-family:var(--serif);font-size:23px;margin:0 0 6px;line-height:1.25}
.empty span{color:var(--muted)}
.search{position:relative;margin:0 0 12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{width:100%;padding:13px 14px 13px 44px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-size:16px}
.search input:focus{outline:none;border-color:var(--lv)}

/* ---------- Today strip ---------- */
.today{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;background:var(--lv-soft);border-radius:var(--r3);padding:12px 16px;margin:0 0 20px}
.ringwrap{position:relative;width:58px;height:58px}
.ring{width:58px;height:58px;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface)}
.ring .fg{stroke:var(--lv);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ringwrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.today-t{margin:0;font-weight:600;font-size:15px}
.today-t b{color:var(--lv);font-variant-numeric:tabular-nums}
.today-s{margin:2px 0 0;font-size:13.5px;color:var(--muted)}

/* ---------- Dictionary entry: the signature element ---------- */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;touch-action:pan-y;box-shadow:var(--lift)}
.entry.from-r{animation:fromR .28s ease-out}
.entry.from-l{animation:fromL .28s ease-out}
@keyframes fromR{from{opacity:0;transform:translateX(26px)}}
@keyframes fromL{from{opacity:0;transform:translateX(-26px)}}
.entry-band{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--lv-soft);font-size:13px;color:var(--muted);flex-wrap:wrap}
.entry-body{padding:18px 22px 22px}
.tag{font-weight:800;color:var(--lv-ink);background:var(--lv);border-radius:7px;padding:2px 8px;font-size:12px}
.status{margin-left:auto}
.st-new{color:var(--lv);font-weight:600}
.st-master{color:var(--ok);font-weight:700}
.headword{font-family:var(--serif);font-weight:600;font-size:clamp(40px,11vw,64px);line-height:1.1;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
.hl{background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-size:100% .42em;background-position:0 88%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .06em}
.hl.sweep{animation:sweep .7s cubic-bezier(.3,.7,.2,1)}
@keyframes sweep{from{background-size:0% .42em}to{background-size:100% .42em}}
.ipa{font-family:var(--ipa);font-size:20px;color:var(--muted);margin:8px 0 0;letter-spacing:.01em}
.audio-row{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
.meaning{font-size:23px;font-weight:650;margin:20px 0 0;padding-top:16px;border-top:1px dashed var(--line);line-height:1.3}
.example{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:14px;align-items:start}
.example .icon-btn{grid-row:span 2;width:40px;height:40px}
.ex-en{margin:0;font-family:var(--serif);font-size:19px;line-height:1.45}
.ex-en span{border-radius:3px;transition:background .1s}
.ex-en span.on{background:var(--marker)}
.ex-fr{margin:0;color:var(--muted);font-size:15px}
.card-nav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:14px}
.card-nav .mid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- Word list ---------- */
.wlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.wlist li+li{border-top:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer}
.wrow:active{background:var(--sunk)}
.spk{width:38px;height:38px;border-radius:50%;background:var(--lv-soft);display:grid;place-items:center;color:var(--lv)}
.spk svg{width:18px;height:18px}
.wcol{display:flex;flex-direction:column;min-width:0}
.wcol .w{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.wcol .p{font-family:var(--ipa);color:var(--muted);font-size:14px}
.wcol .lvtag{font:700 11px var(--sans);color:var(--muted);margin-left:6px}
.wrow .f{color:var(--muted);font-size:14px;text-align:right;max-width:42vw}

/* ---------- Games ---------- */
.games{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:359px){.games{grid-template-columns:1fr}}
@media (min-width:700px){.games{grid-template-columns:repeat(3,1fr)}}
.games li{display:flex}
.gtile{--g:#2846C8;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:16px 14px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.gtile:active{transform:scale(.98)}
.gtile::after{content:"";position:absolute;right:-34px;top:-34px;width:104px;height:104px;border-radius:50%;background:var(--g);opacity:.09;pointer-events:none}
.gtile .gi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--g)}
.gtile .gt{font-weight:750;font-size:16px;line-height:1.2}
.gtile .gd{font-size:13px;color:var(--muted);line-height:1.35}
.gtile .best{margin-top:auto;padding-top:4px;font-size:12px;color:var(--muted)}
.gtile .best b{color:var(--ink);font-variant-numeric:tabular-nums}
.gtile[disabled]{opacity:.5;cursor:not-allowed}
.game-top{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.game-top h2{margin:0;font-size:18px;line-height:1.2}
.game-score{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;background:var(--lv-soft);color:var(--ink);border-radius:999px;padding:5px 12px}
.game-score:empty{display:none}
.bar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar>span{display:block;height:100%;width:0;background:var(--lv);border-radius:4px;transition:width .3s}
.bar.low>span{background:var(--bad)}
.bar.big{height:12px;border-radius:6px;margin:0}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:20px;margin-bottom:14px;transition:border-color .2s,background .2s;box-shadow:var(--lift)}
.prompt.center{text-align:center}
.ask{font-size:14px;color:var(--muted);margin:0 0 8px}
.prompt-word{font-family:var(--serif);font-size:clamp(30px,8.5vw,46px);font-weight:600;line-height:1.12;overflow-wrap:anywhere}
.prompt-fr{font-size:21px;font-weight:650;margin:0 0 6px;line-height:1.35}
.options{display:grid;gap:10px}
@media (min-width:600px){.options{grid-template-columns:1fr 1fr}}
.opt{text-align:left;justify-content:flex-start;min-height:58px;font-weight:500;font-size:16px;padding:10px 14px;line-height:1.3}
.opt kbd{font:600 12px var(--sans);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--sunk);flex:none}
@media (hover:none){.opt kbd{display:none}}
.opt .serif{font-size:18px}
.opt.is-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);opacity:1}
.opt.is-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:13px 16px;border-radius:var(--r2);font-size:15px;line-height:1.45}
.feedback:empty{display:none}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback .serif{font-size:17px;font-weight:600}
.big-play{width:96px;height:96px;border-radius:50%;background:var(--lv);color:var(--lv-ink);border:0;display:grid;place-items:center;margin:6px auto 2px;cursor:pointer;box-shadow:0 12px 26px -12px var(--lv)}
.big-play svg{width:42px;height:42px}
.big-play.playing{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.field{width:100%;font:600 22px var(--serif);padding:14px 16px;border:2px solid var(--line);border-radius:var(--r2);background:var(--surface);color:var(--ink);letter-spacing:.02em}
.field:focus{outline:none;border-color:var(--lv)}
.field:disabled{opacity:.7}
.clue{margin:12px 0 0;font-weight:600}
.clue:empty,.mask:empty{display:none}
.mask{font-family:var(--serif);font-size:24px;letter-spacing:.22em;margin:10px 0 0;color:var(--muted)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.mem{grid-template-columns:repeat(4,1fr)}}
.mcard{aspect-ratio:1/1.12;perspective:700px;border:0;background:none;padding:0;cursor:pointer}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .fc,.mcard .bc{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r2);display:grid;place-items:center;padding:8px;text-align:center}
.mcard .fc{background:var(--lv) repeating-linear-gradient(135deg,transparent 0 9px,rgba(255,255,255,.1) 9px 18px)}
.mcard .bc{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.mcard .bc.en{font-family:var(--serif);font-size:17px}
.mcard .lg{position:absolute;top:6px;left:8px;font:700 10px var(--sans);color:var(--muted)}
.mcard.done .bc{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mcard.miss .bc{border-color:var(--bad);background:var(--bad-soft)}
.slot{min-height:66px;border:2px dashed var(--line);border-radius:var(--r2);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:14px}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-color:var(--bad);animation:shake .35s}
.slot-ph{color:var(--muted);font-size:14px;align-self:center;padding:0 4px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font:500 18px var(--serif);cursor:pointer;color:var(--ink)}
.slot .tok{background:var(--lv-soft);border-color:transparent}
.tok.used{visibility:hidden}
.pair{padding:10px 0 4px}
.pair .en{font-family:var(--serif);font-size:clamp(30px,8vw,42px);font-weight:600;line-height:1.15}
.pair .eq{color:var(--muted);font-size:14px;margin:8px 0}
.pair .fr{font-size:23px;font-weight:650}
.prompt.flash-ok{border-color:var(--ok);background:var(--ok-soft)}
.prompt.flash-bad{border-color:var(--bad);background:var(--bad-soft)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .btn{min-height:78px;font-size:19px}
.time{text-align:center;font-weight:800;font-size:15px;color:var(--muted);margin:10px 0 0;font-variant-numeric:tabular-nums}
.combo{min-height:22px;margin:6px 0 0;color:var(--lv);font-weight:700;font-size:14px}
.hang{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.hang svg{width:96px;height:114px;stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.hang svg .pt{opacity:0;transition:opacity .2s;stroke:var(--bad)}
.hang svg .pt.on{opacity:1}
.word-mask{font-family:var(--serif);font-size:clamp(26px,7.5vw,38px);letter-spacing:.16em;font-weight:600;margin:4px 0;overflow-wrap:anywhere;line-height:1.2}
.lives{color:var(--muted);font-size:14px;margin:0}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.kb button{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;padding:0}
.kb button.hit{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.kb button.miss{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.kb button:disabled{cursor:default}
.kb button:disabled:not(.hit):not(.miss){opacity:.4}
.mic{width:108px;height:108px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;margin:10px auto 4px;cursor:pointer}
.mic svg{width:44px;height:44px}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s ease-in-out infinite}
.heard{text-align:center;color:var(--muted);min-height:24px;margin:6px 0 0;font-size:15px}
.end{padding-top:6px}
.end-score{font-family:var(--serif);font-size:clamp(52px,15vw,78px);font-weight:600;line-height:1;margin:6px 0 10px;letter-spacing:-.02em}
.end-score small{font-size:.45em;color:var(--muted)}
.end-msg{font-size:17px;margin:0 0 4px}
.end-xp{display:inline-block;color:var(--lv);background:var(--lv-soft);font-weight:800;margin:10px 0 0;padding:4px 12px;border-radius:999px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grades .btn{flex-direction:column;min-height:64px;gap:1px;padding:0 8px}
.grades small{font-weight:500;font-size:12px;opacity:.85}

/* ---------- Progress ---------- */
.goal{background:var(--lv-soft);border-radius:var(--r3);padding:20px}
.goal p{font-family:var(--serif);font-size:24px;margin:0 0 14px;line-height:1.25}
.goal .bar.big{background:var(--surface)}
dl.kv{display:grid;grid-template-columns:1fr auto;margin:18px 0 0}
dl.kv dt,dl.kv dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
dl.kv dt{color:var(--muted)}
dl.kv dd{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .m,.stack .m{background:var(--ok)}
.legend .l,.stack .l{background:var(--lv);opacity:.5}
.lvlrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:9px 0}
.lvlrow b{font-size:15px}
.lvlrow .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.stack{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;margin-top:6px}
.week .col{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:4px;font-size:12px;color:var(--muted);height:100%;font-variant-numeric:tabular-nums}
.week .track{position:relative;width:100%;max-width:34px;height:100%}
.week .track i{position:absolute;left:0;right:0;bottom:0;background:var(--lv);border-radius:7px 7px 3px 3px;min-height:3px;opacity:.55}
.week .col.today .track i{opacity:1}
.week .col.today{color:var(--ink);font-weight:700}

/* ---------- Settings ---------- */
.set-group{margin:0 0 24px}
.set-group h2{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.set>*+*{border-top:1px solid var(--line)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px}
.lbl{font-weight:600;min-width:0}
.hint{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:1px}
select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);max-width:52vw;font-size:14px}
input[type=range]{width:42%;max-width:220px;accent-color:var(--lv)}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw:checked{background:var(--lv)}
.sw:checked::after{transform:translateX(20px)}
.note{font-size:13.5px;color:var(--muted);padding:12px 16px;margin:0}
.note.warn{color:var(--bad)}
.det{display:block;padding:13px 16px}
.det summary{cursor:pointer;font-weight:600}
.det textarea{width:100%;min-height:110px;margin-top:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:8px}
.foot{color:var(--muted);font-size:13px;margin:4px 0 0}

/* ---------- Overlays ---------- */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,26,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:26px;padding:22px 20px 18px;max-width:520px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:sheetUp .25s ease-out;max-height:90vh;overflow:auto}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}}
.sheet h2{font-family:var(--serif);font-size:25px;margin:0 0 6px;line-height:1.2}
.sheet p{margin:8px 0;color:var(--muted)}
.sheet ol{padding-left:22px;margin:10px 0}
.sheet li{margin:7px 0}
.sheet .perks{display:grid;gap:8px;margin:14px 0 4px;padding:0;list-style:none}
.sheet .perks li{display:flex;gap:10px;align-items:flex-start;margin:0}
.sheet .perks svg{color:var(--lv);margin-top:1px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}

const fresh=()=>JSON.parse(JSON.stringify(DEFAULTS));
function merge(d){const b=fresh();if(!d||typeof d!=="object")return b;return Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{}),streak:Object.assign(b.streak,d.streak||{}),stats:Object.assign(b.stats,d.stats||{}),srs:d.srs&&typeof d.srs==="object"?d.srs:{},days:d.days&&typeof d.days==="object"?d.days:{},best:d.best&&typeof d.best==="object"?d.best:{}});}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return merge(JSON.parse(raw));}catch(e){}return fresh();}
let S=load();
if(!LEVELS.some(L=>L.id===S.level))S.level="A1";
let saveT=0;
function flush(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function streakNow(){return(S.streak.last===today()||S.streak.last===yesterday())?S.streak.count:0;}
function addXP(n){n=Math.round(n);if(n<=0)return;const t=today();S.xp+=n;S.days[t]=(S.days[t]||0)+n;if(S.streak.last!==t){S.streak.count=S.streak.last===yesterday()?S.streak.count+1:1;S.streak.last=t;}save();renderHeader();}

/* Répétition espacée (boîtes de Leitner) */
const INT=[0,1,3,7,16,35];
function srsOf(id){return S.srs[id]||(S.srs[id]={b:0,d:0,c:0,w:0});}
function grade(w,ok){const r=srsOf(w.id),now=Date.now();if(ok){r.c++;r.b=Math.min(5,r.b+1);r.d=now+INT[r.b]*DAY;}else{r.w++;r.b=1;r.d=now+10*60e3;}save();updateBadge();}
function queue(w){const r=srsOf(w.id);r.b=Math.min(Math.max(r.b,1),1);r.d=Date.now()+10*60e3;save();updateBadge();}
const hardDays=r=>Math.max(.5,INT[Math.max(1,r.b)]/2);
const goodDays=r=>INT[Math.min(5,r.b+1)];
function gradeHard(w){const r=srsOf(w.id);r.c++;r.b=Math.max(1,r.b);r.d=Date.now()+hardDays(r)*DAY;save();updateBadge();}
const fmtDays=d=>d<1?Math.round(d*24)+" h":Math.round(d)+" j";
function dueWords(){const now=Date.now();return Object.keys(S.srs).filter(id=>BYID[id]&&S.srs[id].d<=now).map(id=>BYID[id]);}
function statusOf(w){const r=S.srs[w.id];if(!r)return["Nouveau","st-new"];if(r.b>=4)return["Maîtrisé","st-master"];return["Mémorisation "+r.b+"/5",""];}

/* ================= Voix (synthèse vocale) ================= */
const JUNK=/compact|eloquence|novelty|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|albert|jester|organ|superstar|wobble|bahh|good news|deranged|hysterical|pipe/i;
const TTS={
  ok:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window,voices:[],cur:null,tok:0,
  init(){if(!this.ok)return;this.load();const h=()=>{this.load();if(tab==="settings"&&!inGame)fillVoices();};try{speechSynthesis.addEventListener("voiceschanged",h);}catch(e){speechSynthesis.onvoiceschanged=h;}},
  load(){try{this.voices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));}catch(e){this.voices=[];}},
  lang(v){return String(v.lang||"").replace("_","-").toLowerCase();},
  score(v){const acc=S.settings.accent.toLowerCase(),l=this.lang(v),n=v.name||"";let s=0;if(l===acc)s+=100;else if(l.startsWith("en"))s+=30;if(/natural|neural/i.test(n))s+=45;if(/premium|enhanced/i.test(n))s+=35;if(/google/i.test(n))s+=25;if(/online/i.test(n))s+=15;if(/siri|samantha|daniel|serena|karen|moira/i.test(n))s+=12;if(v.default&&l===acc)s+=3;if(JUNK.test(n))s-=300;return s;},
  ranked(){return this.voices.slice().sort((a,b)=>this.score(b)-this.score(a));},
  pick(){if(S.settings.voice){const v=this.voices.find(x=>x.voiceURI===S.settings.voice);if(v)return v;}return this.ranked()[0]||null;},
  stop(){if(this.ok){try{speechSynthesis.cancel();}catch(e){}}},
  speak(text,o={}){
    if(!this.ok){toast("La synthèse vocale n'est pas disponible dans ce navigateur.");return;}
    if(!this.voices.length)this.load();
    const u=new SpeechSynthesisUtterance(text),v=this.pick();
    if(v){u.voice=v;u.lang=v.lang;}else u.lang=S.settings.accent;
    u.rate=o.rate||S.settings.rate;u.pitch=1;u.volume=1;
    const end=()=>{if(this.cur===u)this.cur=null;if(o.onend)o.onend();};
    u.onstart=()=>{if(o.onstart)o.onstart();};u.onend=end;u.onerror=end;
    if(o.onboundary)u.onboundary=o.onboundary;
    this.cur=u;const t=++this.tok;
    const go=()=>{if(t!==this.tok)return;try{if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}};
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,70);}else go();
  }
};
const slowRate=()=>Math.max(.5,S.settings.rate*.62);
function say(text,slow){TTS.speak(text,{rate:slow?slowRate():0,onstart:()=>{const hw=$("#hw");if(hw){hw.classList.remove("sweep");void hw.offsetWidth;hw.classList.add("sweep");}$$(".big-play").forEach(b=>b.classList.add("playing"));},onend:()=>$$(".big-play").forEach(b=>b.classList.remove("playing"))});}
function karaoke(t){let out="",i=0;t.split(/(\s+)/).forEach(part=>{if(/^\s+$/.test(part))out+=part;else if(part)out+=`<span data-i="${i}">${esc(part)}</span>`;i+=part.length;});return out;}
function sayExample(text,el){const spans=el?$$("span[data-i]",el):[];const clear=()=>spans.forEach(s=>s.classList.remove("on"));TTS.speak(text,{onboundary:e=>{if(e.name&&e.name!=="word")return;let cur=null;for(const s of spans){if(+s.dataset.i<=e.charIndex)cur=s;else break;}clear();if(cur)cur.classList.add("on");},onend:clear});}

/* Effets sonores courts (Web Audio, aucun fichier externe) */
let AC=null;
function sfx(type){if(!S.settings.sfx)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const t=AC.currentTime;const tone=(f,st,d,vol,wave)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=wave||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t+st);g.gain.exponentialRampToValueAtTime(vol||.06,t+st+.012);g.gain.exponentialRampToValueAtTime(.0001,t+st+d);o.connect(g);g.connect(AC.destination);o.start(t+st);o.stop(t+st+d+.03);};
if(type==="ok"){tone(660,0,.09);tone(990,.07,.13);}else if(type==="bad"){tone(196,0,.2,.07,"triangle");if(navigator.vibrate)navigator.vibrate(35);}else if(type==="end"){tone(523,0,.1);tone(659,.09,.1);tone(784,.18,.2);}else if(type==="tick"){tone(880,0,.05,.03);}}catch(e){}}

function todayStrip(){
  const tx=S.days[today()]||0,goal=S.settings.goal,p=Math.min(1,tx/goal),st=streakNow(),C=2*Math.PI*23,L=lvl();

}

function go(t){teardown();if(t!=="review")R=null;tab=t;$$("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));VIEWS[t]();window.scrollTo(0,0);}

V.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-theme],[data-game]");
  if(!t||!V.contains(t)||t.disabled)return;
  if(t.dataset.act==="sayid"){const w=BYID[t.dataset.id];if(w)say(w.en);return;}

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||!onKey)return;
  const tag=(e.target&&e.target.tagName)||"";
  if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  if((e.key==="Enter"||e.key===" ")&&tag==="BUTTON")return;
  onKey(e);

function bindSwipe(el,onLeft,onRight){if(!el)return;let x0=null,y0=0;el.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});el.addEventListener("touchend",e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?onLeft():onRight();}},{passive:true});}

let L_idx=0,L_mode="cards",L_shuf=false,L_order=null,L_key="",L_rev=false;

function viewLearn(){

  V.innerHTML=`${todayStrip()}<h1 class="view-title">Vocabulaire ${L.id}, ${L.name.toLowerCase()}</h1>
  <p class="view-sub">${esc(L.desc)}</p>
  ${themeChips()}
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Affichage"><button data-act="mode" data-v="cards" aria-pressed="${L_mode==="cards"}">Cartes</button><button data-act="mode" data-v="list" aria-pressed="${L_mode==="list"}">Liste</button></div>
    ${L_mode==="cards"?`<div class="tools"><button class="btn btn-quiet sm" data-act="shuffle" aria-pressed="${L_shuf}">${L_shuf?"Ordre normal":"Mélanger"}</button><button class="btn btn-quiet sm" data-act="hidefr" aria-pressed="${S.settings.hideFr}">${S.settings.hideFr?"Afficher le français":"Mode test"}</button></div>`:""}
  </div>

function endGame(g,o){
  timers.forEach(clearTimeout);timers=[];if(cleanup){try{cleanup();}catch(e){}cleanup=null;}onKey=null;
  S.stats.played=(S.stats.played||0)+1;

  ${missed.length?`<h3 class="sub">À retravailler</h3><ul class="wlist">${missed.map(wordRow).join("")}</ul>`:""}

/* --- Quiz express --- */

    <div class="options">${opts.map((o,k)=>`<button class="btn opt" data-act="pick" data-k="${k}"><kbd>${k+1}</kbd>${type==="fr2en"?`<span class="serif" lang="en">${esc(o.en)}</span>`:`<span>${esc(o.fr)}</span>`}</button>`).join("")}</div>
    <div class="feedback" id="fb" role="status"></div>
    <div class="actions" id="nextRow" hidden><button class="btn btn-primary grow" data-act="next">${i+1<n?"Question suivante":"Voir le résultat"}</button></div>`;

    else{missed.push(w);fb.className="feedback bad";fb.innerHTML=`La bonne réponse était <strong>${esc(cur.type==="fr2en"?w.en:w.fr)}</strong>. <span class="serif" lang="en">${esc(w.en)}</span> se prononce /${esc(w.ipa)}/.`;sfx("bad");}
    setScore(score+" / "+n);later(()=>say(w.en),220);

    if(ok)timer=later(next,1700);

  function next(){clearTimeout(timer);if(!locked)return;i++;if(i>=n)return endGame(g,{score,max:n,xp:score*10,missed,label:score+" / "+n});show();}

/* --- Dictée --- */
function gameDictee(g){
  let base=pool().filter(w=>w.en.length<=22);if(base.length<4)base=lvl().words;
  const words=sample(base,8),n=words.length;
  let i=0,score=0,xp=0,missed=[],hints=0,done=false,showFr=false;
  const mask=(w,h)=>{let k=0;return w.en.split("").map(c=>{if(!/[a-z]/i.test(c))return c===" "?"\u2003":c;const s=k<h?c:"_";k++;return s;}).join("");};
  function show(){
    const w=words[i];hints=0;done=false;showFr=false;setProg(i,n);setScore(score+" / "+n);
    $("#gBody").innerHTML=`<div class="prompt center"><p class="ask">Écoute et écris le mot en anglais.</p><button class="big-play" data-act="say" aria-label="Réécouter">${icon("speaker")}</button>
      <div class="row-c"><button class="btn btn-quiet sm" data-act="slow">Lentement</button><button class="btn btn-quiet sm" data-act="fr">Voir la traduction</button></div><p class="clue" id="clue"></p><p class="mask" id="mask" lang="en"></p></div>
    <input class="field" id="ans" type="text" lang="en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Tape ce que tu entends" aria-label="Ta réponse">
    <div class="feedback" id="fb" role="status"></div>
    <div class="actions" id="act1"><button class="btn" data-act="hint">Indice</button><button class="btn btn-primary grow" data-act="check">Valider</button></div>
    <div class="actions" id="act2" hidden><button class="btn btn-primary grow" data-act="next">${i+1<n?"Mot suivant":"Voir le résultat"}</button></div>`;
    say(w.en);
    const inp=$("#ans");
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();check();}});
    later(()=>{try{inp.focus({preventScroll:true});}catch(e){}},60);
  }
  function check(){
    if(done)return;const w=words[i],inp=$("#ans"),v=inp.value;
    if(!v.trim()){inp.focus();return;}
    done=true;const ok=spellEq(v,w.en);grade(w,ok);const fb=$("#fb");
    if(ok){score++;const gain=Math.max(5,15-hints*3-(showFr?2:0));xp+=gain;fb.className="feedback ok";fb.innerHTML=`Parfait : <span class="serif" lang="en">${esc(w.en)}</span> (${esc(w.fr)}). +${gain} XP`;sfx("ok");}
    else{missed.push(w);const close=lev(norm(v),norm(w.en))<=Math.max(1,w.en.length/5|0);fb.className="feedback bad";fb.innerHTML=`${close?"Presque !":"Pas tout à fait."} Tu as écrit « ${esc(v)} ». La bonne orthographe est <span class="serif" lang="en">${esc(w.en)}</span> (${esc(w.fr)}).`;sfx("bad");}
    inp.disabled=true;$("#act1").hidden=true;$("#act2").hidden=false;setScore(score+" / "+n);later(()=>say(w.en),250);
    later(()=>{const b=$("#act2 button");if(b)b.focus();},30);
  }
  function next(){if(!done)return;i++;if(i>=n)return endGame(g,{score,max:n,xp,missed,label:score+" / "+n});show();}
  onAct=t=>{const a=t.dataset.act,w=words[i];
    if(a==="say")say(w.en);else if(a==="slow")say(w.en,true);
    else if(a==="fr"){showFr=true;$("#clue").textContent="Traduction : "+w.fr;}
    else if(a==="hint"){const letters=w.en.replace(/[^a-z]/gi,"").length;if(hints<letters-1){hints++;$("#mask").textContent=mask(w,hints);}}
    else if(a==="check")check();else if(a==="next")next();};
  onKey=e=>{if(e.key==="Enter"&&done)next();};
  show();
}

/* --- Memory --- */
function gameMemory(g){
  let base=uniqBy(uniqBy(pool(),w=>w.fr),w=>w.en);if(base.length<6)base=uniqBy(lvl().words,w=>w.fr);
  const words=sample(base,6),cards=shuffle(words.flatMap(w=>[{w,side:"en"},{w,side:"fr"}]));
  let open=[],moves=0,found=0,busy=false;const t0=Date.now();
  setScore("0 coup");setProg(0,6);
  $("#gBody").innerHTML=`<p class="ask">Retourne deux cartes : un mot anglais et sa traduction.</p><div class="mem">${cards.map((c,k)=>`<button class="mcard" data-act="flip" data-k="${k}" aria-label="Carte ${k+1}, face cachée"><span class="in"><span class="fc"></span><span class="bc ${c.side}" ${c.side==="en"?'lang="en"':""}><span class="lg">${c.side==="en"?"EN":"FR"}</span>${esc(c.side==="en"?c.w.en:c.w.fr)}</span></span></button>`).join("")}</div>`;
  const el=k=>$(`.mcard[data-k="${k}"]`);
  function flip(k){
    if(busy)return;const e=el(k),c=cards[k];if(!e||e.classList.contains("up"))return;
    e.classList.add("up");e.setAttribute("aria-label",(c.side==="en"?c.w.en:c.w.fr));
    if(c.side==="en")say(c.w.en);
    open.push(k);if(open.length<2)return;
    moves++;setScore(plural(moves,"coup"));const a=open[0],b=open[1];open=[];
    if(cards[a].w===cards[b].w){
      found++;grade(cards[a].w,true);[a,b].forEach(x=>el(x).classList.add("done"));setProg(found,6);sfx("ok");
      if(c.side==="fr")later(()=>say(c.w.en),150);
      if(found===6)later(()=>{const sec=Math.round((Date.now()-t0)/1000);endGame(g,{score:moves,lower:true,xp:Math.max(10,70-(moves-6)*5),label:plural(moves,"coup"),msg:moves<=8?"Mémoire impressionnante.":moves<=12?"Bien joué.":"Rejoue pour faire moins de coups.",extra:`<p class="end-msg">Temps : ${sec} s</p>`});},800);
    }else{
      busy=true;[a,b].forEach(x=>el(x).classList.add("miss"));
      later(()=>{[a,b].forEach(x=>{const m=el(x);if(m){m.classList.remove("up","miss");m.setAttribute("aria-label","Carte "+(x+1)+", face cachée");}});busy=false;},950);
    }
  }
  onAct=t=>{if(t.dataset.act==="flip")flip(+t.dataset.k);};
}

/* --- Phrases en désordre --- */
function gamePhrases(g){
  const list=sample(SENT[S.level]||SENT.A1,6),n=list.length;
  let i=0,score=0,xp=0,placed=[],solved=false,attempts=0,order=[],msg=null,shake=false;
  function show(){const s=list[i];placed=[];solved=false;attempts=0;msg=null;order=shuffle(s.toks.map((_,k)=>k));if(order.length>1&&order.every((v,k)=>v===k))order.reverse();render();}
  function render(){
    const s=list[i];setProg(i,n);setScore(score+" / "+n);
    $("#gBody").innerHTML=`<div class="prompt"><p class="ask">Traduis en remettant les mots dans l'ordre.</p><p class="prompt-fr">${esc(s.fr)}</p><button class="btn btn-quiet sm" data-act="listen">${icon("speaker")}Écouter la phrase</button></div>
    <div class="slot ${solved?"ok":""} ${shake?"bad":""}" lang="en" aria-label="Ta phrase">${placed.length?placed.map((k,p)=>`<button class="tok" data-act="unplace" data-p="${p}" ${solved?"disabled":""}>${esc(s.toks[k])}</button>`).join(""):'<span class="slot-ph">Touche les mots dans l\'ordre</span>'}</div>
    <div class="bank" lang="en">${order.map(k=>{const u=placed.includes(k);return `<button class="tok ${u?"used":""}" data-act="place" data-k="${k}" ${u||solved?'disabled tabindex="-1"':""}>${esc(s.toks[k])}</button>`;}).join("")}</div>
    <div class="feedback ${msg?msg.c:""}" id="fb" role="status">${msg?msg.h:""}</div>
    <div class="actions">${solved?`<button class="btn btn-primary grow" data-act="next">${i+1<n?"Phrase suivante":"Voir le résultat"}</button>`:`<button class="btn" data-act="clear">Effacer</button><button class="btn" data-act="solution">Solution</button><button class="btn btn-primary grow" data-act="check" ${placed.length===s.toks.length?"":"disabled"}>Vérifier</button>`}</div>`;
    shake=false;
  }
  function check(){
    const s=list[i],built=placed.map(k=>s.toks[k]).join(" ");
    if(built===s.en){solved=true;score++;const gain=attempts===0?20:10;xp+=gain;msg={c:"ok",h:`Bravo. +${gain} XP`};sfx("ok");render();say(s.en);}
    else{attempts++;msg={c:"bad",h:"Pas encore : vérifie l'ordre des mots, ou écoute la phrase."};shake=true;sfx("bad");render();}
  }
  onAct=t=>{const a=t.dataset.act,s=list[i];
    if(a==="place"&&!solved){const k=+t.dataset.k;if(!placed.includes(k)){placed.push(k);msg=null;render();if(placed.length===s.toks.length)check();}}
    else if(a==="unplace"&&!solved){placed.splice(+t.dataset.p,1);msg=null;render();}
    else if(a==="clear"){placed=[];msg=null;render();}
    else if(a==="listen")say(s.en);
    else if(a==="solution"){placed=s.toks.map((_,k)=>k);solved=true;msg={c:"bad",h:"Voici la phrase correcte. Écoute-la et retiens sa construction."};render();say(s.en);}
    else if(a==="check")check();
    else if(a==="next"){i++;if(i>=n)return endGame(g,{score,max:n,xp,label:score+" / "+n});show();}};
  onKey=e=>{if(e.key==="Enter"&&solved){i++;if(i>=n)return endGame(g,{score,max:n,xp,label:score+" / "+n});show();}};
  show();
}

/* --- Chrono 60 s --- */
function gameChrono(g){
  const words=pool(6),lw=lvl().words,DUR=60000;
  let score=0,combo=0,bestCombo=0,end=0,cur=null,running=false,raf=0,missed=[];
  setScore("0");setProg(1,1);
  $("#gBody").innerHTML=`<div class="prompt center"><p class="ask">Une minute pour dire si la traduction proposée est juste.</p><p class="only-mouse lives">Clavier : flèche gauche pour Faux, flèche droite pour Vrai.</p><button class="btn btn-primary wide" data-act="start">Démarrer</button></div>`;
  function nextQ(){
    const w=words[Math.random()*words.length|0],truth=Math.random()<.5;
    let fr=w.fr;if(!truth){const o=sample(lw.filter(x=>x.fr!==w.fr&&x.id!==w.id),1)[0];if(o)fr=o.fr;}
    cur={w,truth,fr};
    $("#pp").innerHTML=`<div class="pair"><div class="en" lang="en">${esc(w.en)}</div><div class="eq">veut dire</div><div class="fr">${esc(fr)}</div></div><p class="combo">${combo>=3?"Série de "+combo:""}</p>`;
  }
  function answer(v){
    if(!running||!cur)return;const ok=v===cur.truth,pp=$("#pp");
    pp.classList.remove("flash-ok","flash-bad");void pp.offsetWidth;pp.classList.add(ok?"flash-ok":"flash-bad");
    if(ok){score++;combo++;bestCombo=Math.max(bestCombo,combo);sfx("tick");}
    else{combo=0;missed.push(cur.w);grade(cur.w,false);sfx("bad");}
    setScore(String(score));nextQ();
  }
  function tick(){
    const left=end-Date.now();if(left<=0)return finish();
    $("#gBar").style.width=(left/DUR*100)+"%";$("#gBarWrap").classList.toggle("low",left<10000);
    const t=$("#time");if(t)t.textContent=Math.ceil(left/1000)+" s";
    raf=requestAnimationFrame(tick);
  }
  function start(){
    running=true;end=Date.now()+DUR;
    $("#gBody").innerHTML=`<div class="prompt center" id="pp"></div><div class="tf"><button class="btn btn-bad" data-act="no">Faux</button><button class="btn btn-ok" data-act="yes">Vrai</button></div><p class="time" id="time">60 s</p>`;
    nextQ();raf=requestAnimationFrame(tick);
  }
  function finish(){running=false;cancelAnimationFrame(raf);const gw=$("#gBarWrap");if(gw)gw.classList.remove("low");
    endGame(g,{score,xp:score*2,missed,label:plural(score,"point"),msg:score>=25?"Réflexes impressionnants.":score>=15?"Belle vitesse.":"Entraîne-toi pour battre ton record.",extra:`<p class="end-msg">Meilleure série : ${bestCombo}</p>`});}
  cleanup=()=>{running=false;cancelAnimationFrame(raf);};
  onAct=t=>{const a=t.dataset.act;if(a==="start")start();else if(a==="yes")answer(true);else if(a==="no")answer(false);};
  onKey=e=>{if(!running)return;if(e.key==="ArrowRight"||e.key==="v"){e.preventDefault();answer(true);}else if(e.key==="ArrowLeft"||e.key==="f"){e.preventDefault();answer(false);}};
}

/* --- Pendu --- */
function gamePendu(g){
  const okW=w=>/^[a-z]+$/i.test(w.en)&&w.en.length>=4&&w.en.length<=12;
  let base=pool().filter(okW);if(base.length<5)base=lvl().words.filter(okW);
  const words=sample(base,5),n=words.length,MAXE=6;
  let i=0,score=0,xp=0,missed=[],guessed=new Set(),errors=0,over=false,msg=null;
  const parts=['<circle class="pt" cx="74" cy="31" r="9"/>','<path class="pt" d="M74 40v30"/>','<path class="pt" d="M74 48l-13 11"/>','<path class="pt" d="M74 48l13 11"/>','<path class="pt" d="M74 70l-11 20"/>','<path class="pt" d="M74 70l11 20"/>'];
  function show(){guessed=new Set();errors=0;over=false;msg=null;render();}
  function render(){
    const w=words[i],low=w.en.toLowerCase();setProg(i,n);setScore(score+" / "+n);
    const masked=w.en.split("").map(c=>over||guessed.has(c.toLowerCase())?c:"_").join("");
    $("#gBody").innerHTML=`<div class="prompt"><div class="hang"><svg viewBox="0 0 100 120" aria-hidden="true"><path d="M8 112h56M24 112V8h50v14"/>${parts.map((p,k)=>k<errors?p.replace('class="pt"','class="pt on"'):p).join("")}</svg>
      <div><p class="ask">Indice : ${esc(w.fr)}</p><p class="word-mask" lang="en" aria-label="Mot à trouver : ${masked.length} lettres">${esc(masked)}</p><p class="lives">${over?"&nbsp;":plural(MAXE-errors,"essai")+" restant"+(MAXE-errors>1?"s":"")}</p></div></div></div>
    <div class="kb">${"abcdefghijklmnopqrstuvwxyz".split("").map(c=>{const u=guessed.has(c);return `<button data-act="letter" data-c="${c}" class="${u?(low.includes(c)?"hit":"miss"):""}" ${u||over?"disabled":""} aria-label="Lettre ${c.toUpperCase()}">${c.toUpperCase()}</button>`;}).join("")}</div>
    <div class="feedback ${msg?msg.c:""}" role="status">${msg?msg.h:""}</div>
    ${over?`<div class="actions"><button class="btn btn-primary grow" data-act="next">${i+1<n?"Mot suivant":"Voir le résultat"}</button></div>`:""}`;
  }
  function guess(c){
    if(over||guessed.has(c))return;const w=words[i],low=w.en.toLowerCase();guessed.add(c);
    if(!low.includes(c)){errors++;sfx("bad");}else sfx("tick");
    const win=low.split("").every(ch=>guessed.has(ch));
    if(win){over=true;score++;const gain=Math.max(5,15-errors*2);xp+=gain;grade(w,true);msg={c:"ok",h:`Trouvé : <span class="serif" lang="en">${esc(w.en)}</span> /${esc(w.ipa)}/. +${gain} XP`};sfx("ok");later(()=>say(w.en),200);}
    else if(errors>=MAXE){over=true;missed.push(w);grade(w,false);msg={c:"bad",h:`Le mot était <span class="serif" lang="en">${esc(w.en)}</span> /${esc(w.ipa)}/.`};later(()=>say(w.en),200);}
    render();
  }
  function next(){if(!over)return;i++;if(i>=n)return endGame(g,{score,max:n,xp,missed,label:score+" / "+n});show();}
  onAct=t=>{const a=t.dataset.act;if(a==="letter")guess(t.dataset.c);else if(a==="next")next();};
  onKey=e=>{const k=e.key.toLowerCase();if(/^[a-z]$/.test(k))guess(k);else if(e.key==="Enter")next();};
  show();
}

/* --- Prononciation (reconnaissance vocale) --- */
function gameParle(g){
  if(!SR){$("#gBody").innerHTML=`<div class="empty"><p>Reconnaissance vocale indisponible.</p><span>Ouvre l'appli dans Chrome ou Edge pour utiliser ce jeu.</span></div>`;return;}
  const words=sample(pool(),8),n=words.length;
  let i=0,score=0,xp=0,missed=[],tries=0,rec=null,listening=false,done=false;
  function show(){
    tries=0;done=false;const w=words[i];setProg(i,n);setScore(score+" / "+n);
    $("#gBody").innerHTML=`<div class="prompt center"><p class="ask">Écoute le modèle, puis prononce le mot.</p><div class="prompt-word" lang="en"><span class="hl" id="hw">${esc(w.en)}</span></div><p class="ipa" lang="en">/${esc(w.ipa)}/</p><p class="lives">${esc(w.fr)}</p>
      <div class="row-c"><button class="btn sm" data-act="say">${icon("speaker")}Écouter</button><button class="btn btn-quiet sm" data-act="slow">Lentement</button></div></div>
    <button class="mic" data-act="mic" id="mic" aria-label="Parler">${icon("mic")}</button>
    <p class="heard" id="heard" role="status">Touche le micro, puis parle.</p>
    <div class="feedback" id="fb"></div>
    <div class="actions" id="acts"><button class="btn grow" data-act="skip">Passer ce mot</button></div>`;
    if(S.settings.autoplay&&interacted)say(w.en);
  }
  function finishWord(){$("#acts").innerHTML=`<button class="btn btn-primary grow" data-act="next">${i+1<n?"Mot suivant":"Voir le résultat"}</button>`;}
  function listen(){
    if(listening){try{rec.stop();}catch(e){}return;}
    if(done)return;TTS.stop();
    rec=new SR();rec.lang=S.settings.accent;rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
    const heard=$("#heard"),mic=$("#mic");
    rec.onstart=()=>{listening=true;if(mic)mic.classList.add("on");if(heard)heard.textContent="Je t'écoute…";};
    rec.onerror=e=>{const m={"not-allowed":"Accès au micro refusé. Autorise le micro pour cette page, ou ouvre le fichier directement dans Chrome.","service-not-allowed":"Reconnaissance vocale bloquée ici. Ouvre le fichier directement dans Chrome.","no-speech":"Je n'ai rien entendu. Rapproche-toi du micro et réessaie.","audio-capture":"Aucun micro détecté sur cet appareil.","network":"La reconnaissance vocale a besoin d'une connexion internet."}[e.error];if(m&&heard)heard.textContent=m;};
    rec.onend=()=>{listening=false;if(mic)mic.classList.remove("on");};
    rec.onresult=e=>{const alts=Array.from(e.results[0]).map(a=>a.transcript);evaluate(alts);};
    try{rec.start();}catch(err){if(heard)heard.textContent="Impossible de démarrer le micro. Réessaie.";}
  }
  function evaluate(alts){
    const w=words[i],target=norm(w.en),cands=alts.map(a=>numWords(norm(a)));
    const ok=cands.some(h=>h===target||(" "+h+" ").includes(" "+target+" "));
    const heardTxt=alts[0]||"";tries++;const fb=$("#fb");
    $("#heard").textContent=heardTxt?`Entendu : « ${heardTxt} »`:"";
    if(ok){done=true;score++;const gain=tries===1?15:10;xp+=gain;grade(w,true);fb.className="feedback ok";fb.innerHTML=`Bien prononcé. +${gain} XP`;sfx("ok");finishWord();}
    else{
      const sim=1-lev(cands[0]||"",target)/Math.max(target.length,1);
      if(tries>=3){done=true;missed.push(w);grade(w,false);fb.className="feedback bad";fb.innerHTML=`Pas encore reconnu. Ce mot reviendra en révision : écoute bien le modèle.`;sfx("bad");finishWord();later(()=>say(w.en,true),300);}
      else{fb.className="feedback bad";fb.innerHTML=`${sim>=.6?"Presque.":"Pas encore."} Écoute le modèle et réessaie (essai ${tries} sur 3).`;sfx("bad");}
    }
    setScore(score+" / "+n);
  }
  onAct=t=>{const a=t.dataset.act,w=words[i];
    if(a==="say")say(w.en);else if(a==="slow")say(w.en,true);else if(a==="mic")listen();
    else if(a==="skip"){if(rec)try{rec.abort();}catch(e){}missed.push(w);grade(w,false);i++;if(i>=n)return endGame(g,{score,max:n,xp,missed,label:score+" / "+n});show();}
    else if(a==="next"){i++;if(i>=n)return endGame(g,{score,max:n,xp,missed,label:score+" / "+n});show();}};
  cleanup=()=>{if(rec){try{rec.abort();}catch(e){}}};
  show();
}

/* ================= Orthographe britannique / américaine ================= */
const usSpell=s=>s.replace(/isation/g,"ization").replace(/is(e|ed|es|ing)\b/g,"iz$1").replace(/our\b/g,"or").replace(/tre\b/g,"ter").replace(/ogue\b/g,"og").replace(/lled\b/g,"led");
function spellEq(a,b){a=norm(a);b=norm(b);return a===b||usSpell(a)===usSpell(b);}

/* ================= Confettis (fin de partie réussie) ================= */
function confetti(){
  try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext("2d");if(!x){c.remove();return;}x.scale(dpr,dpr);
  const lv=getComputedStyle(document.documentElement).getPropertyValue("--lv").trim()||"#2846C8";
  const cols=[lv,"#FFE15A","#FF7D93","#4FD1A8","#8DA2FF","#FFB347"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.32,vx:(Math.random()-.5)*11,vy:-Math.random()*11-5,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:9+Math.random()*8,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();let last=t0;
  (function f(t){const dt=Math.min(32,t-last)/16;last=t;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.32*dt;p.vx*=.992;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.max(.25,Math.abs(Math.cos(p.r*1.7))));x.restore();});
    if(t-t0<2800)requestAnimationFrame(f);else c.remove();})(t0);
}

function isStandalone(){try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches||navigator.standalone===true;}catch(e){return false;}}
function renderInstall(){const b=$("#installBtn");if(b)b.hidden=isStandalone();}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;renderInstall();});
addEventListener("appinstalled",()=>{deferredPrompt=null;renderInstall();toast("English Lab est installée sur ton appareil.");if(tab==="settings"&&!inGame)viewSettings();});
async function doInstall(){
  if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==="accepted")toast("Installation en cours…");}catch(e){openInstallHelp();}renderInstall();return;}
  openInstallHelp();
}
function openInstallHelp(){
  const ua=navigator.userAgent||"",ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),android=/android/i.test(ua),firefox=/firefox|fxios/i.test(ua),samsung=/samsungbrowser/i.test(ua);
  let framed=false;try{framed=window.top!==window.self;}catch(e){framed=true;}
  const perks=`<ul class="perks"><li>${icon("check")}<span>Icône sur l'écran d'accueil, ouverture en plein écran.</span></li><li>${icon("offline")}<span>Utilisable sans connexion une fois installée.</span></li><li>${icon("check")}<span>Ta progression reste sur l'appareil.</span></li></ul>`;
  let how;
  if(location.protocol==="file:")how=`<p>Ouverte comme fichier local, la page ne peut pas être installée : le navigateur exige une adresse https.</p><ol><li>Crée un dépôt GitHub et dépose tous les fichiers du dossier English Lab (index.html, manifest.webmanifest, sw.js et les icônes).</li><li>Dans Settings, section Pages, active GitHub Pages sur la branche principale.</li><li>Ouvre l'adresse https obtenue dans Chrome, puis touche Installer.</li></ol>`;
  else if(framed)how=`<p>L'appli est affichée dans un aperçu intégré. Ouvre-la dans un onglet à part, puis touche Installer.</p>`;
  else if(ios)how=`<ol><li>Ouvre cette page dans Safari.</li><li>Touche le bouton Partager.</li><li>Choisis « Sur l'écran d'accueil », puis Ajouter.</li></ol>`;
  else if(samsung)how=`<ol><li>Ouvre le menu du navigateur (trois traits en bas).</li><li>Choisis « Ajouter la page à », puis « Écran d'accueil ».</li></ol>`;
  else if(android)how=`<ol><li>Ouvre le menu ⋮ de Chrome, en haut à droite.</li><li>Choisis « Installer l'application » ou « Ajouter à l'écran d'accueil ».</li><li>Confirme : l'icône English Lab apparaît sur ton écran d'accueil.</li></ol><p>Si l'option n'apparaît pas, recharge la page une fois puis réessaie.</p>`;
  else if(firefox)how=`<p>Firefox pour ordinateur ne sait pas installer d'applications web. Ouvre cette page dans Chrome ou Edge, puis clique sur Installer.</p>`;
  else how=`<ol><li>Clique sur l'icône d'installation à droite de la barre d'adresse.</li><li>Ou ouvre le menu du navigateur et choisis « Installer English Lab ».</li></ol><p>Si l'option n'apparaît pas, recharge la page une fois puis réessaie.</p>`;
  $("#sheetBody").innerHTML=perks+how;$("#sheet").hidden=false;$("#sheetClose").focus();
}
function closeSheet(){$("#sheet").hidden=true;}
$("#installBtn").addEventListener("click",doInstall);
$("#sheetClose").addEventListener("click",closeSheet);
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();});
function drawIcon(size,maskable){
  const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d"),k=size/512;
  x.fillStyle="#FFFFFF";
  if(maskable)x.fillRect(0,0,size,size);else{const r=112*k;x.beginPath();x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();x.fill();}
  const z=maskable?.78:1;x.translate(size/2,size/2);x.scale(z,z);x.translate(-size/2,-size/2);
  x.fillStyle="#FFE15A";x.fillRect(92*k,292*k,328*k,86*k);
  x.fillStyle="#141A30";x.font=`700 ${268*k}px Georgia,"Noto Serif","Times New Roman",serif`;x.textAlign="center";x.textBaseline="alphabetic";x.fillText("en",256*k,352*k);
  x.fillStyle="#2846C8";x.beginPath();x.arc(404*k,128*k,34*k,0,Math.PI*2);x.fill();
  return c.toDataURL("image/png");
}
function initPWA(){
  renderInstall();
  if(!/^https?:$/.test(location.protocol)||typeof fetch!=="function")return;
  fetch("manifest.webmanifest",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;}).catch(()=>{
    try{
      const base=location.href.split("#")[0].split("?")[0],scope=base.slice(0,base.lastIndexOf("/")+1);
      const m={name:"English Lab",short_name:"English Lab",description:"Apprendre l'anglais du niveau A1 au C1",lang:"fr",id:base,start_url:base,scope,display:"standalone",orientation:"portrait",background_color:"#F4F6FB",theme_color:"#F4F6FB",icons:[{src:drawIcon(192),sizes:"192x192",type:"image/png"},{src:drawIcon(512),sizes:"512x512",type:"image/png"},{src:drawIcon(512,true),sizes:"512x512",type:"image/png",purpose:"maskable"}]};
      $("#manifestLink").href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
      $("#appleIcon").href=drawIcon(180,true);
    }catch(e){}
  });
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
if(DARK_MQ){const h=()=>applyLevelColors();if(DARK_MQ.addEventListener)DARK_MQ.addEventListener("change",h);else if(DARK_MQ.addListener)DARK_MQ.addListener(h);}
try{matchMedia("(display-mode: standalone)").addEventListener("change",renderInstall);}catch(e){}

applyTheme();TTS.init();renderLevels();renderTabs();renderHeader();go("learn");initPWA();
</script>
</body>
